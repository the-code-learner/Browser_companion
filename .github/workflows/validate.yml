name: Validate Browser Companion

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Resolve security patch versions (temporary lockfile export)
        run: |
          npm audit fix --package-lock-only || true
          echo BEGIN_AUDITED_LOCKFILE_BASE64
          base64 -w 4096 package-lock.json
          echo END_AUDITED_LOCKFILE_BASE64
      - run: npm ci
      - run: npm run check:syntax
      - run: npm run check
      - run: npm test
      - run: npm run test:memory
      - run: npm run test:attachments
      - run: npm audit --audit-level=high --omit=dev
